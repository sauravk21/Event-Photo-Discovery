services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # the image has no curl/wget, so probe the port with bash
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333  # "localhost" inside a container is the container itself
      FACE_MODEL: ${FACE_MODEL:-buffalo_l}
    volumes:
      - app_data:/data  # uploaded photos + SQLite
      - insightface_models:/root/.insightface  # keeps the model download across rebuilds
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_data:
  app_data:
  insightface_models:
